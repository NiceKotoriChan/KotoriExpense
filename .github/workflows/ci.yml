name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v7

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 跑测试
        run: |
          if find test -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "test/ 下没有 *_test.dart，跳过"
          fi

  apk:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v7

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 还原签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没配 KEYSTORE_BASE64，这次用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: 打 release APK
        run: flutter build apk --release

      - name: 存 APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
